  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://www.optileno.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://www.optileno.com/" />
    <meta property="og:image" content="https://www.optileno.com/og-image.png" />

    />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('optileno.v2') || '{}');
          var pref = t && t.settings && t.settings.theme;
          if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
