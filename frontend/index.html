  <style>
    #root:empty {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #010205;
      z-index: 99999;
    }

    .startup-logo {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .s-ring {
      stroke-dasharray: 830;
      stroke-dashoffset: 830;
      animation: s-drawRing 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite alternate;
    }

    .s-glow {
      animation: s-pulseGlow 2s ease-in-out infinite alternate;
    }

    .s-node {
      transform-origin: center;
      transform-box: fill-box;
      transform: scale(0);
      animation: s-popNode 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards infinite alternate;
    }

    .s-line {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: s-drawLine 0.8s ease forwards infinite alternate;
    }

    .s-n1 {
      animation-delay: 0.1s;
    }

    .s-n2,
    .s-n3 {
      animation-delay: 0.2s;
    }

    .s-n4,
    .s-n5 {
      animation-delay: 0.3s;
    }

    .s-n6 {
      animation-delay: 0.4s;
    }

    .s-l1,
    .s-l2 {
      animation-delay: 0.4s;
    }

    .s-l3,
    .s-l4 {
      animation-delay: 0.6s;
    }

    .s-l5,
    .s-l6 {
      animation-delay: 0.8s;
    }

    @keyframes s-drawRing {
      0% {
        stroke-dashoffset: 830;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes s-popNode {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes s-drawLine {
      0% {
        stroke-dashoffset: 120;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes s-pulseGlow {
      0% {
        opacity: 0.2;
      }

      100% {
        opacity: 0.6;
      }
    }
  </style>
