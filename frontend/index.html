<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Optileno — Every small change has a price</title>
    <meta name="description" content="Optileno helps freelancers on fixed-price projects stop doing free work by accident. Log any client request, see if it's in scope, then charge it or gift it on purpose. Your client sees a clear scope page and approves in one tap." />
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="canonical" href="https://www.optileno.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Optileno" />
    <meta property="og:title" content="Every small change has a price — Optileno" />
    <meta property="og:description" content="Stop doing free work by accident. Log a client request, see if it's in scope, then charge it or gift it, on purpose." />
    <meta property="og:url" content="https://www.optileno.com/" />
    <meta property="og:image" content="https://www.optileno.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Every small change has a price — Optileno" />
    <meta name="twitter:description" content="Stop doing free work by accident. Charge it or gift it, never lose it." />
    <meta name="twitter:image" content="https://www.optileno.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Optileno",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.optileno.com/",
        "description": "Scope tracking and change orders for freelancers on fixed-price projects. Log client requests, charge or gift extras on purpose, and share a clear scope page your client can approve.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free during early access" }
      }
    </script>
    <script>
      (function () {
        try {
          if (location.pathname.indexOf('/app') !== 0) return;
          var t = JSON.parse(localStorage.getItem('optileno.v3') || '{}');
          var pref = t && t.settings && t.settings.theme;
          if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Optileno needs JavaScript to run. It keeps your projects on your own device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
