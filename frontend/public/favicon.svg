<svg width="512" height="512" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Mark fills the canvas so it stays legible at 16-32px tab size -->
  <g>
    <!-- Ring -->
    <circle cx="256" cy="256" r="200"
            stroke="url(#mainGradientLight)"
            stroke-width="24"
            fill="none" />

    <!-- Connections -->
    <g stroke="url(#mainGradientLight)" stroke-linecap="round" stroke-width="12">
      <line x1="256" y1="126" x2="156" y2="226"/>
      <line x1="256" y1="126" x2="356" y2="226"/>
      <line x1="156" y1="226" x2="129" y2="338"/>
      <line x1="356" y1="226" x2="383" y2="338"/>
      <line x1="129" y1="338" x2="256" y2="398"/>
      <line x1="383" y1="338" x2="256" y2="398"/>
    </g>

    <!-- Nodes -->
    <circle cx="256" cy="126" r="22" fill="url(#mainGradientLight)"/>
    <circle cx="156" cy="226" r="18" fill="url(#mainGradientLight)"/>
    <circle cx="356" cy="226" r="18" fill="url(#mainGradientLight)"/>
    <circle cx="129" cy="338" r="16" fill="url(#mainGradientLight)"/>
    <circle cx="383" cy="338" r="16" fill="url(#mainGradientLight)"/>
    <circle cx="256" cy="398" r="22" fill="url(#mainGradientLight)"/>
  </g>
</svg>
